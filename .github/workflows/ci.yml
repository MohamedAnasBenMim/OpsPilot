name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Tests, lint et évaluation de l'agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - name: Les règles Kubernetes sont synchronisées avec observability/
        run: python scripts/render_prometheusrule.py && git diff --exit-code deploy/k8s/base/prometheusrule.yaml
      - name: Évaluation du diagnostic (seuil de non-régression)
        run: PYTHONPATH=pilot python eval/run_eval.py --engine rules --min-top1 0.9
      - name: Résumé
        if: always()
        run: cat eval/results/results.md >> "$GITHUB_STEP_SUMMARY"

  manifests:
    name: Kubernetes, Prometheus, Alertmanager
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Outils
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar xz
          curl -sSL https://github.com/prometheus/prometheus/releases/download/v2.55.1/prometheus-2.55.1.linux-amd64.tar.gz | tar xz --strip-components=1 prometheus-2.55.1.linux-amd64/promtool
          curl -sSL https://github.com/prometheus/alertmanager/releases/download/v0.27.0/alertmanager-0.27.0.linux-amd64.tar.gz | tar xz --strip-components=1 alertmanager-0.27.0.linux-amd64/amtool
      - name: Kustomize + kubeconform (CRD Prometheus Operator et Argo CD incluses)
        run: |
          ./kustomize build deploy/k8s/overlays/local > rendered.yaml
          ./kubeconform -strict -summary -kubernetes-version 1.31.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -skip PodChaos,NetworkChaos,StressChaos \
            rendered.yaml deploy/argocd/application.yaml deploy/chaos/experiments.yaml
      - run: ./promtool check rules observability/prometheus/rules/slo.yml
      - run: ./amtool check-config observability/alertmanager/alertmanager.yml

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [local, azure]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive infra/terraform
      - working-directory: infra/terraform/envs/${{ matrix.env }}
        run: terraform init -backend=false -input=false && terraform validate

  images:
    name: Images Docker
    runs-on: ubuntu-latest
    needs: [python]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: app
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/mohamedanasbenmim/opspilot-orders-api:latest,ghcr.io/mohamedanasbenmim/opspilot-orders-api:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: pilot
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/mohamedanasbenmim/opspilot-agent:latest,ghcr.io/mohamedanasbenmim/opspilot-agent:${{ github.sha }}
