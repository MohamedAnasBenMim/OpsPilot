global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: orders-api
    static_configs:
      - targets: ["orders-api:8000"]
  - job_name: opspilot
    static_configs:
      - targets: ["opspilot:8080"]
