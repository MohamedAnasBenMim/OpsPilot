apiVersion: v1
kind: ServiceAccount
metadata:
  name: opspilot
  namespace: shop
---
# Lecture seule : événements et ReplicaSets du namespace surveillé (principe du moindre privilège)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opspilot-reader
  namespace: shop
rules:
  - apiGroups: [""]
    resources: [events, pods]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [replicasets, deployments]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opspilot-reader
  namespace: shop
subjects:
  - {kind: ServiceAccount, name: opspilot, namespace: shop}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opspilot-reader
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opspilot
  namespace: shop
  labels: {app: opspilot}
spec:
  replicas: 1
  selector:
    matchLabels: {app: opspilot}
  template:
    metadata:
      labels: {app: opspilot}
    spec:
      serviceAccountName: opspilot
      securityContext: {runAsNonRoot: true, runAsUser: 1000}
      containers:
        - name: opspilot
          image: ghcr.io/mohamedanasbenmim/opspilot-agent:latest
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: PROMETHEUS_URL, value: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090"}
            - {name: LOKI_URL, value: "http://loki.monitoring.svc:3100"}
            - {name: LOKI_SELECTOR, value: '{namespace="shop", app="$SVC"}'}
            - {name: TARGET_NAMESPACE, value: shop}
            - {name: PUBLIC_URL, value: "http://localhost:8080"}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef: {name: opspilot-llm, key: api-key, optional: true}
            - name: CHAT_WEBHOOK_URL
              valueFrom:
                secretKeyRef: {name: opspilot-llm, key: chat-webhook-url, optional: true}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /health, port: http}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: opspilot
  namespace: shop
  labels: {app: opspilot}
spec:
  selector: {app: opspilot}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: opspilot
  namespace: shop
spec:
  jobLabel: app
  selector:
    matchLabels: {app: opspilot}
  endpoints:
    - {port: http, path: /metrics, interval: 30s}
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: opspilot
  namespace: shop
spec:
  route:
    receiver: opspilot
    groupBy: [alertname, service]
    groupWait: 10s
    groupInterval: 2m
    repeatInterval: 1h
  receivers:
    - name: opspilot
      webhookConfigs:
        - url: http://opspilot.shop.svc:8080/webhook/alertmanager
          sendResolved: false
